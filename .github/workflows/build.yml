name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Least privilege by default: only the release job needs write access (see below).
permissions:
  contents: read

# Supersede superseded runs on the same ref (e.g. a force-push) instead of burning
# DDK minutes on builds whose results will never be used.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    # DDK kernel builds are slow (toolchain download + full module build).
    timeout-minutes: 60
    strategy:
      matrix:
        kmi:
          # This is the GZIF fork: README/PORTING-GZIF.md and
          # app/src/main/jni/CMakeLists.txt support android13-5.15 only.
          # Building the other 7 upstream KMIs produced artifacts that were
          # never consumed by the APK (CMake embeds only dfroot-android13-5.15.ko),
          # so the matrix is reduced to the single KMI actually shipped.
          - android13-5.15
    container:
      # No --privileged: the same DDK image builds the LKM locally via podman
      # with only --pid=host --network=none, so no extra caps are required.
      # Digest pinned (floating tags are mutable): resolved via GHCR token +
      # manifest HEAD and cross-verified with `docker buildx imagetools inspect`.
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828@sha256:9e68cd9fcab748584755d31ba88ef134efc938dbde17f258c2652315f6cd81cd
    steps:
      - uses: actions/checkout@v7

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build-dfroot:
    needs: build-lkms
    runs-on: ubuntu-latest
    # Gradle + native build; comfortably under 30 minutes for this small app.
    timeout-minutes: 30
    # Only the tag-triggered "Create GitHub Release" step needs write access.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Validate signing config
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing KEYSTORE"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing. All of KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD are required for release builds."
            exit 1
          fi

      - name: Create signing.properties
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Secrets are supplied via env (never interpolated into shell source), and
          # each value is escaped for java.util.Properties.load() before being written:
          #   \  -> \\   (load() treats backslash as an escape introducer)
          #   LF -> \n   CR -> \r   (a real newline would start a new entry)
          #   leading space/tab/form-feed -> escaped (load() trims it after '=')
          #   non-ASCII -> \uXXXX (load(InputStream) decodes ISO-8859-1, not UTF-8)
          esc_props() {
            local s=$1 out= c n leading=1 i
            local len=${#s}
            for (( i = 0; i < len; i++ )); do
              c=${s:i:1}
              case $c in
                '\')   out+='\\' ;;
                $'\r') out+='\r' ;;
                $'\n') out+='\n' ;;
                $'\t') out+='\t' ;;
                $'\f') out+='\f' ;;
                ' ')   if (( leading )); then out+='\ '; else out+=' '; fi ;;
                *)
                  printf -v n '%d' "'$c"
                  if (( n > 126 )); then
                    printf -v n '\\u%04x' "$n"
                    out+=$n
                  else
                    out+=$c
                  fi
                  ;;
              esac
              [[ $c == ' ' ]] || leading=0
            done
            printf '%s' "$out"
          }
          umask 077
          printf 'KEYSTORE_FILE=../keystore.jks\n' > signing.properties
          printf 'KEYSTORE_PASSWORD=%s\n' "$(esc_props "$KEYSTORE_PASSWORD")" >> signing.properties
          printf 'KEY_ALIAS=%s\n' "$(esc_props "$KEY_ALIAS")" >> signing.properties
          printf 'KEY_PASSWORD=%s\n' "$(esc_props "$KEY_PASSWORD")" >> signing.properties
          printf '%s' "$KEYSTORE" | base64 --decode > keystore.jks

      - name: Download DF LKM (android13-5.15)
        # The upload-artifact step stores out/dfroot-android13-5.15.ko at the
        # archive root (single file => LCA is out/), so downloading by name into
        # app/src/main/jni/ko/ yields exactly app/src/main/jni/ko/dfroot-android13-5.15.ko,
        # which is the path CMakeLists.txt embeds. No pattern/merge needed now that
        # the matrix has a single KMI.
        uses: actions/download-artifact@v7
        with:
          name: df-lkm-android13-5.15
          path: app/src/main/jni/ko/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build DFRoot APK
        run: |
          set -e
          for i in 1 2 3; do
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              if ./gradlew :app:assembleDebug; then break; fi
            else
              if ./gradlew :app:assembleRelease; then break; fi
            fi
            if [ "$i" = "3" ]; then
              echo "Gradle build failed after 3 attempts"
              exit 1
            fi
            echo "Gradle build failed (attempt $i), retrying in 30s..."
            sleep 30
          done

      - name: Upload DFRoot APK
        uses: actions/upload-artifact@v7
        with:
          name: DFRoot
          path: |
            app/build/outputs/apk/release/DFRoot_*.apk
            app/build/outputs/apk/debug/DFRoot_*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/DFRoot_*.apk
