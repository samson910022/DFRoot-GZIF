# Modified 2026-11-24 (DFRoot GZIF): removed `android.useAndroidX=true`.
# The app has no AndroidX dependencies (dependencies {} is empty and the settings
# UI uses the framework android.preference.* API), and AGP 9.x enables AndroidX
# by default, so the flag was inert. Keeping the file (comment-only) documents the
# decision without asserting a dependency the project does not have.
